name: Check external link freshness

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/link-freshness.yml"
      - "scripts/check_links.py"
      - "tests/test_check_links.py"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install -r requirements.txt
      - name: Check official and evidence links
        # Network findings are advisory; unexpected checker errors must still fail the job.
        run: >-
          python scripts/check_links.py --max-urls 150 --output link-check.json
          --summary "$GITHUB_STEP_SUMMARY"
